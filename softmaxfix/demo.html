<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Slingshot Effect</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      user-select: none;
    }
    canvas {
      display: block;
    }
    input[type="range"] {
      accent-color: #eab308;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased">
  <div class="max-w-5xl mx-auto rounded-xl border border-[var(--border)] bg-[var(--card)] p-3.5 shadow-sm">
    <!-- Top Controls Bar -->
    <div class="flex flex-col gap-2 mb-2.5 px-2.5 py-2 rounded-lg bg-[var(--muted)]/60 border border-[var(--border)] text-xs">
      <!-- Row 1: Presets (left) + Precision dtypes -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-1.5">
          <span class="font-semibold text-[var(--foreground)]">Preset:</span>
          <div class="inline-flex rounded-md border border-[var(--border)] bg-[var(--card)] p-0.5 gap-0.5">
            <button data-preset="wd" class="preset-btn px-2.5 py-0.5 rounded text-xs transition-colors">Lots of Weight Decay &amp; Noise-Free Labels</button>
            <button data-preset="noisy" class="preset-btn px-2.5 py-0.5 rounded text-xs transition-colors">No Weight Decay &amp; Noisy Labels</button>
          </div>
        </div>
        <div class="flex items-center gap-1.5 border-l border-[var(--border)] pl-3">
          <span class="font-semibold text-[var(--foreground)]">Precision:</span>
          <div class="inline-flex rounded-md border border-[var(--border)] bg-[var(--card)] p-0.5 gap-0.5">
            <button data-p="8" class="dtype-btn px-2.5 py-0.5 rounded font-mono text-xs transition-colors">bf16</button>
            <button data-p="24" class="dtype-btn px-2.5 py-0.5 rounded font-mono text-xs transition-colors">fp32</button>
            <button data-p="52" class="dtype-btn px-2.5 py-0.5 rounded font-mono text-xs transition-colors">fp64</button>
          </div>
        </div>
      </div>

      <!-- Row 2: Sliders (Cross-entropy, Weight decay, Adam ε, Label Noise) + Frozen Betas -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-[var(--border)]/60">
        <div class="flex flex-wrap items-center gap-2.5">
          <div class="flex items-center gap-1" title="Cross-entropy loss magnitude on a non-linear log10 scale (0, then 0.1 to 10)">
            <span class="font-semibold text-[var(--foreground)]">CE Mult:</span>
            <input id="ceSlider" type="range" min="-1.1" max="1.0" step="0.05" value="0.0" class="w-16 cursor-pointer" />
            <span id="ceLabel" class="font-mono font-semibold text-[var(--foreground)] w-8"></span>
          </div>
          <div class="flex items-center gap-1 border-l border-[var(--border)] pl-2" title="Decoupled weight decay λ on a non-linear log10 scale (0, then 0.1 to 10)">
            <span class="font-semibold text-[var(--foreground)]">Weight decay:</span>
            <input id="wdSlider" type="range" min="-1.1" max="1.0" step="0.05" value="0.0" class="w-16 cursor-pointer" />
            <span id="wdLabel" class="font-mono font-semibold text-[var(--foreground)] w-8"></span>
          </div>
          <div class="flex items-center gap-1 border-l border-[var(--border)] pl-2" title="Adam denominator epsilon ε = 10^-d">
            <span class="font-semibold text-[var(--foreground)]">Adam ε:</span>
            <input id="epsSlider" type="range" min="-30" max="-1" step="1" value="-16" class="w-16 cursor-pointer" />
            <span id="epsLabel" class="font-mono font-semibold text-[var(--foreground)] w-11"></span>
          </div>
          <div class="flex items-center gap-1 border-l border-[var(--border)] pl-2" title="Label noise probability on a log10 scale (0, then 0.0001 to 0.1)">
            <span class="font-semibold text-[var(--foreground)]">Label Noise:</span>
            <input id="outlierSlider" type="range" min="-4.1" max="-1.0" step="0.05" value="-4.1" class="w-16 cursor-pointer" />
            <span id="outlierLabel" class="font-mono font-semibold text-[var(--foreground)] w-12"></span>
          </div>
        </div>
        <div class="flex items-center gap-2 border-l border-[var(--border)] pl-2.5">
          <span class="font-mono text-[var(--muted-foreground)]">β₁ = 0.5</span>
          <span class="font-mono text-[var(--muted-foreground)] border-l border-[var(--border)] pl-2">β₂ = 0.9</span>
        </div>
      </div>
    </div>

    <!-- Main 2-Column Content -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-stretch">
      <div class="md:col-span-5 rounded-lg border border-[var(--border)] bg-[var(--background)] overflow-hidden">
        <div id="mapWrap" style="position: relative; width: 100%; aspect-ratio: 1 / 1;">
          <canvas id="mapCanvas" class="cursor-crosshair" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
        </div>
      </div>
      <div class="md:col-span-7 rounded-lg border border-[var(--border)] bg-[var(--background)] p-2 flex flex-col">
        <div id="stripWrap" style="position: relative; width: 100%; flex: 1 1 auto; min-height: 360px;">
          <canvas id="stripCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom Bar: Refresh Rate Control & Night Mode Toggle -->
    <div class="flex flex-wrap items-center justify-between gap-2 mt-2.5 px-2.5 py-1.5 rounded-lg bg-[var(--muted)]/60 border border-[var(--border)] text-xs">
      <div class="flex items-center gap-1.5">
        <span class="font-semibold text-[var(--foreground)]">Refresh Rate:</span>
        <div class="inline-flex rounded-md border border-[var(--border)] bg-[var(--card)] p-0.5 gap-0.5">
          <button data-fps="0" class="fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors">Pause</button>
          <button data-fps="5" class="fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors">5Hz</button>
          <button data-fps="15" class="fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors">15Hz</button>
          <button data-fps="30" class="fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors">30Hz</button>
          <button data-fps="60" class="fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors">60Hz</button>
          <button data-fps="120" class="fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors">120Hz</button>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="themeToggleBtn" type="button" class="px-2.5 py-0.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-semibold text-xs transition-colors hover:bg-[var(--muted)]"></button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================================
    // URL overrides (optional): ?b1=0.3&b2=0.96&lr=0.018&wd=0.24
    //                           &eps=44&p=8&linkeps=1&bitscale=8.5&spf=1&fps=35
    //                           &preset=eq_bf16_active|eq_fp32_active|eq_bf16_damped|eq_fp32_damped
    //                           &theme=light|dark&warmup=0&x=-0.295&y=-0.177
    // =====================================================================
    const URL_PARAMS = new URLSearchParams(window.location.search);
    function numParam(name, fallback) {
      const raw = URL_PARAMS.get(name);
      const val = raw === null ? NaN : Number(raw);
      return Number.isFinite(val) ? val : fallback;
    }
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    // ?title=0 / ?legend=0 hide the in-map title and legend (for video capture).
    const SHOW_MAP_TITLE = URL_PARAMS.get('title') !== '0';
    let SHOW_LEGEND = URL_PARAMS.get('legend') !== '0';
    // ?pills=0 hides the bf16 / fp32 / fp64 contour labels.
    const SHOW_DTYPE_PILLS = URL_PARAMS.get('pills') !== '0';
    const MAP_REF_PX = numParam('mapref', 0);
    const FORCED_THEME = URL_PARAMS.get('theme');
    let userTheme = (FORCED_THEME === 'light' || FORCED_THEME === 'dark') ? FORCED_THEME : 'light';

    function isDark() {
      if (userTheme === 'light') return false;
      if (userTheme === 'dark') return true;
      if (document.documentElement.classList.contains('light')) return false;
      if (document.documentElement.classList.contains('dark')) return true;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    // Standalone & interactive theme variables.
    function ensureStandaloneTheme() {
      const dark = isDark();
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      const vars = dark ? {
        '--background': '#0b0f19',
        '--foreground': '#f8fafc',
        '--card': '#111827',
        '--card-foreground': '#f8fafc',
        '--muted': '#1e293b',
        '--muted-foreground': '#94a3b8',
        '--border': '#1f2937'
      } : {
        '--background': '#ffffff',
        '--foreground': '#0f172a',
        '--card': '#f8fafc',
        '--card-foreground': '#0f172a',
        '--muted': '#f1f5f9',
        '--muted-foreground': '#64748b',
        '--border': '#e2e8f0'
      };
      Object.entries(vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
      document.body.style.backgroundColor = vars['--background'];
    }
    ensureStandaloneTheme();

    const mapWrap = document.getElementById('mapWrap');
    const stripWrap = document.getElementById('stripWrap');
    const mapCanvas = document.getElementById('mapCanvas');
    const stripCanvas = document.getElementById('stripCanvas');

    // ?maponly=1 shows only the loss landscape (used by slingshot_record.html).
    // The rest of the widget stays in the DOM, just hidden.
    const MAP_ONLY = URL_PARAMS.get('maponly') === '1';
    if (MAP_ONLY) {
      const hiddenRest = document.createElement('div');
      hiddenRest.style.display = 'none';
      hiddenRest.appendChild(document.body.firstElementChild);
      document.body.prepend(mapWrap, hiddenRest);
      document.body.style.padding = '0';
      document.body.style.overflow = 'hidden';
    }

    const COL_FIX = '#3B82F6';  // Blue: Our Fixed Cross-Entropy
    const COL_STD = '#EF4444';  // Red: Standard Cross-Entropy
    const COL_DEAD = '#FACC15'; // Yellow: dead zone & slingshot

    const SUP_DIGITS = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
    function fmtPow2(expInt) {
      const s = String(Math.round(expInt));
      return '2' + s.split('').map(c => SUP_DIGITS[c] || c).join('');
    }

    // =====================================================================
    // Hyperparameters. Both markers always share every one of these.
    // BIT_SCALE zooms the bit-depth dynamic range by a radial power law
    // (||g_sim|| = ||g_raw||^(1 / BIT_SCALE), eps_sim = 2^(-epsExp / BIT_SCALE))
    // so one animation frame = one smooth AdamW step while the strip plots
    // display the exact 55-bit dynamic range via dispLog2(v).
    //
    // Frozen Adam moment decays:
    //   beta1 = 0.5, beta2 = 0.9
    // =====================================================================
    let BETA1 = numParam('b1', 0.5);
    let BETA2 = numParam('b2', 0.9);
    const LR = numParam('lr', 0.018);
    const BIT_SCALE = Math.max(1.0, numParam('bitscale', 8.5));
    let pBits = Math.round(clamp(numParam('p', 8), 4, 52) / 4) * 4;
    let epsExp = Math.round(clamp(numParam('eps', 16), 1, 30));
    let ceWeight = clamp(numParam('ce', 1.0), 0.0, 10.0);
    let ceSliderVal = ceWeight < 0.099 ? -1.1 : clamp(Math.log10(ceWeight), -1.0, 1.0);
    let outlierProb = clamp(numParam('outlier', 0), 0.0, 0.1);
    let outlierSliderVal = outlierProb < 0.000095 ? -4.1 : clamp(Math.log10(outlierProb), -4.0, -1.0);
    let weightDecay = clamp(numParam('wd', 1), 0.0, 10.0);
    let wdSliderVal = weightDecay < 0.099 ? -1.1 : clamp(Math.log10(weightDecay), -1.0, 1.0);
    function wdFromSlider(s) {
      return s <= -1.05 ? 0.0 : Math.pow(10.0, clamp(s, -1.0, 1.0));
    }
    function outlierFromSlider(s) {
      return s <= -4.05 ? 0.0 : Math.pow(10.0, clamp(s, -4.0, -1.0));
    }
    function fmtWd(w) {
      if (w === 0.0) return '0';
      if (w < 1.0) return w.toFixed(2);
      if (w < 9.95) return w.toFixed(1);
      return String(Math.round(w));
    }
    function fmtOutlierProb(p) {
      if (p <= 0.0) return '0';
      if (p < 0.001) return p.toFixed(4);
      if (p < 0.01) return p.toFixed(3);
      if (p < 0.0995) return p.toFixed(2);
      return '0.1';
    }
    const slingOnset = clamp(numParam('onset', 0.25), 0.0, 2.0);
    const slingSpan = clamp(numParam('span', 2.40), 0.2, 4.5);
    const slingGamma = clamp(numParam('gamma', 1.0), 0.3, 3.0);
    let targetFps = Math.round(numParam('fps', 60));
    const MAX_H = 45;

    // Weight decay pulls toward theta0 ("zero weights"), a point in the
    // high-loss region. Its contours mark fixed penalty levels
    // (wd / 2) |theta - theta0|^2 = WD_LEVEL * k^2, i.e. evenly spaced rings
    // whose spacing shrinks like 1 / sqrt(wd) as weight decay is cranked up.
    const WD_X = -0.45;
    const WD_Y = -0.4;
    const WD_LEVEL = 0.001728;

    // =====================================================================
    // Toy model: three linear hyperplanes forming a rounded triangular bowl over
    // two parameters theta = (x, y), oriented so one curved corner points
    // directly from the CE nadir (0, 0) toward the WD nadir (WD_X, WD_Y) and
    // softened by 6x at the corners (CORNER_SOFTNESS = 6.0).
    // On a noisy-label event, the yellow Float Cutoff shifts to the next inner
    // contour level in the active contour plot (stepK = 16 at CE Mult = 1,
    // which is ~0.645x of the bf16 radius).
    // =====================================================================
    const SX = 84.0, SY = 84.0;
    const M0 = 34.5 * Math.LN2;
    const CORNER_SOFTNESS = 6.0;
    const ELBOW_ANG = Math.atan2(WD_Y, WD_X) + 0.025;
    const ANGLES = [
      ELBOW_ANG - Math.PI / 3.0,
      ELBOW_ANG + Math.PI / 3.0,
      ELBOW_ANG + Math.PI
    ];
    const SCALES = [1.05, 0.95, 1.00];
    const BASE_PLANES = ANGLES.map((phi, idx) => ({
      ax: -SX * SCALES[idx] * Math.cos(phi),
      ay: -SY * SCALES[idx] * Math.sin(phi),
      b: M0
    }));
    const U_MAX = M0 - CORNER_SOFTNESS * Math.log(3.0);
    const M_ORIGIN = 52.8 * Math.LN2;
    const M_SLOPE = 66.5 / 32.9150375;
    const NOISY_CONTRACT = (44.8 - 24.0) / (44.8 - 8.0);

    function evalMargin(x, y, contract = 1.0) {
      const sx = x / contract, sy = y / contract;
      const m0 = BASE_PLANES[0].b + BASE_PLANES[0].ax * sx + BASE_PLANES[0].ay * sy;
      const m1 = BASE_PLANES[1].b + BASE_PLANES[1].ax * sx + BASE_PLANES[1].ay * sy;
      const m2 = BASE_PLANES[2].b + BASE_PLANES[2].ax * sx + BASE_PLANES[2].ay * sy;
      const mn = Math.min(m0, m1, m2);
      const e0 = Math.exp(-(m0 - mn) / CORNER_SOFTNESS);
      const e1 = Math.exp(-(m1 - mn) / CORNER_SOFTNESS);
      const e2 = Math.exp(-(m2 - mn) / CORNER_SOFTNESS);
      const s = e0 + e1 + e2;
      const u = mn - CORNER_SOFTNESS * Math.log(s);
      const dux = (e0 * BASE_PLANES[0].ax + e1 * BASE_PLANES[1].ax + e2 * BASE_PLANES[2].ax) / (s * contract);
      const duy = (e0 * BASE_PLANES[0].ay + e1 * BASE_PLANES[1].ay + e2 * BASE_PLANES[2].ay) / (s * contract);
      return { m: M_ORIGIN - M_SLOPE * (U_MAX - u), dmx: M_SLOPE * dux, dmy: M_SLOPE * duy };
    }

    function lossFromMargin(m) {
      return m > 0 ? Math.log1p(Math.exp(-m)) : -m + Math.log1p(Math.exp(m));
    }

    // Round-to-nearest on a p-bit significand (exponent range unlimited).
    function roundToMantissa(x, p) {
      if (x === 0.0 || !Number.isFinite(x)) return x;
      const sign = x < 0 ? -1.0 : 1.0;
      const ax = Math.abs(x);
      const e = Math.floor(Math.log2(ax));
      const scale = Math.pow(2.0, p - 1 - e);
      return sign * (Math.round(ax * scale) / scale);
    }

    // dL/dm evaluated in p-bit arithmetic.
    // Standard CE: p_t = 1 / (1 + e^-m), dL/dm = p_t - 1. Once 1 + e^-m rounds
    // to 1 (e^-m < 2^-p), p_t is exactly 1 and the gradient is exactly 0.
    function gradScaleStandard(m, p) {
      const em = roundToMantissa(Math.exp(-m), p);
      const pt = roundToMantissa(1.0 / roundToMantissa(1.0 + em, p), p);
      return roundToMantissa(pt - 1.0, p);
    }
    // Fixed CE: dL/dm = -e^-m / (1 + e^-m), same precision, no cancellation.
    function gradScaleFixed(m, p) {
      const em = roundToMantissa(Math.exp(-m), p);
      return -roundToMantissa(em / roundToMantissa(1.0 + em, p), p);
    }

    // Bit-depth zoom: radial power-law compression of the gradient norm so the
    // 55-bit dynamic range maps to 55 / BIT_SCALE bits in the optimizer while
    // preserving exact direction and the exact p-bit dead-zone boundary.
    function zoomGrad(gx, gy) {
      const g2 = gx * gx + gy * gy;
      if (g2 === 0.0 || !Number.isFinite(g2)) return { gx: 0.0, gy: 0.0 };
      const s = Math.pow(g2, 0.5 * (1.0 / BIT_SCALE - 1.0));
      return { gx: gx * s, gy: gy * s };
    }

    function chordToExit(x, y, dx, dy, targetM) {
      let lo = 0.02, hi = 0.90;
      for (let i = 0; i < 20; i++) {
        const mid = 0.5 * (lo + hi);
        if (evalMargin(x + mid * dx, y + mid * dy, 1.0).m > targetM) lo = mid;
        else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    // Plain AdamW (Loshchilov & Hutter), identical for both markers:
    //   m <- b1 m + (1 - b1) g,   v <- b2 v + (1 - b2) g^2,
    //   theta <- theta - lr * ( ce * m_hat / (sqrt(v_hat) + eps) + wd * (theta - theta0) )
    // Diagonal preconditioning is evaluated along parameter axes rotated by
    // 24 deg relative to the CE->WD axis so asymmetric moment starvation across
    // the two coordinates scatters bounces across the 6x-softened elbow.
    const STEP_UNZOOM = 1.45;
    const DIAG_ANG = Math.atan2(WD_Y, WD_X) + 0.42;
    const DIAG_CA = Math.cos(DIAG_ANG), DIAG_SA = Math.sin(DIAG_ANG);
    function makeOptState(x, y) {
      const ev = evalMargin(x, y);
      const gs = gradScaleFixed(ev.m, 52);
      const zg = zoomGrad(gs * ev.dmx, gs * ev.dmy);
      const g2 = Math.max(1e-6, zg.gx * zg.gx + zg.gy * zg.gy);
      return { x, y, t: 20, mx: 0.0, my: 0.0, vx: g2, vy: g2, gx: 0.0, gy: 0.0 };
    }
    function adamwStep(o, gx, gy, hp) {
      o.t += 1;
      o.gx = gx;
      o.gy = gy;
      const g1 =  DIAG_CA * gx + DIAG_SA * gy;
      const g2 = -DIAG_SA * gx + DIAG_CA * gy;
      const vxPrev = o.vx, vyPrev = o.vy;
      const b2Eff = (gx === 0.0 && gy === 0.0) ? Math.pow(hp.b2, 2.2) : hp.b2;
      o.mx = hp.b1 * o.mx + (1.0 - hp.b1) * g1;
      o.my = hp.b1 * o.my + (1.0 - hp.b1) * g2;
      o.vx = b2Eff * o.vx + (1.0 - hp.b2) * g1 * g1;
      o.vy = b2Eff * o.vy + (1.0 - hp.b2) * g2 * g2;
      const cShock = Math.pow(1.0 - hp.b2, 3.1);
      const vxEff = b2Eff * vxPrev + cShock * g1 * g1;
      const vyEff = b2Eff * vyPrev + cShock * g2 * g2;
      const bc1 = 1.0 - Math.pow(hp.b1, o.t);
      const bc2 = 1.0 - Math.pow(hp.b2, o.t);
      const mh1 = o.mx / bc1, mh2 = o.my / bc1;
      const sh1 = Math.sqrt(vxEff / bc2), sh2 = Math.sqrt(vyEff / bc2);
      let u1 = mh1 / (sh1 + hp.eps);
      let u2 = mh2 / (sh2 + hp.eps);
      let ux = DIAG_CA * u1 - DIAG_SA * u2;
      let uy = DIAG_SA * u1 + DIAG_CA * u2;
      const uMag = Math.hypot(ux, uy);
      if (uMag > 1.0) {
        const gain = Math.pow(uMag, STEP_UNZOOM - 1.0);
        ux *= gain;
        uy *= gain;
      }
      const stepNorm = Math.hypot(ux, uy);
      const rawDisp = hp.lr * hp.ce * stepNorm;
      if (hp.wd < 0.05 && uMag > 1.8 && stepNorm > 0.0) {
        const dirX = -ux / stepNorm, dirY = -uy / stepNorm;
        const exitDist = chordToExit(o.x, o.y, dirX, dirY, pBits * Math.LN2);
        const sc = (0.96 * exitDist) / rawDisp;
        ux *= sc;
        uy *= sc;
      } else if (rawDisp > 0.34) {
        const sc = 0.34 / rawDisp;
        ux *= sc;
        uy *= sc;
      }
      o.x -= hp.lr * (hp.ce * ux + hp.wd * (o.x - hp.wdX));
      o.y -= hp.lr * (hp.ce * uy + hp.wd * (o.y - hp.wdY));
      if (hp.wd < 0.05 && uMag > 1.8) {
        const evLand = evalMargin(o.x, o.y);
        const gsLand = gradScaleFixed(evLand.m, 52);
        const zgLand = zoomGrad(gsLand * evLand.dmx, gsLand * evLand.dmy);
        const gLand2 = zgLand.gx * zgLand.gx + zgLand.gy * zgLand.gy;
        o.vx = Math.max(o.vx, 0.35 * gLand2);
        o.vy = Math.max(o.vy, 0.35 * gLand2);
        o.mx = 0.0;
        o.my = 0.0;
      }
      return {
        m1Mag: Math.hypot(mh1, mh2),
        denomMag: Math.hypot(sh1, sh2) + hp.eps,
        updMag: hp.ce * Math.hypot(ux, uy)
      };
    }

    function radiusForMargin(ang, targetM, contract = 1.0, cx = 0.0, cy = 0.0) {
      let lo = 0.0, hi = 6.0;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      for (let i = 0; i < 32; i++) {
        const mid = 0.5 * (lo + hi);
        if (evalMargin(cx + mid * ca, cy + mid * sa, contract).m > targetM) lo = mid;
        else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    function hyperparams() {
      return {
        b1: BETA1, b2: BETA2, eps: Math.pow(10.0, -epsExp / BIT_SCALE), lr: LR,
        ce: ceWeight, wd: weightDecay, wdX: WD_X, wdY: WD_Y
      };
    }

    // =====================================================================
    // Contours (scaled by the Cross-entropy slider) and dtype contour labels
    // (bf16, fp32, fp64 only).
    // =====================================================================
    const NUM_CONTOUR_SEGS = 180;
    function contourForMargin(targetM) {
      const pts = [];
      for (let s = 0; s < NUM_CONTOUR_SEGS; s++) {
        const ang = (s / NUM_CONTOUR_SEGS) * Math.PI * 2.0;
        const rad = radiusForMargin(ang, targetM, 1.0);
        pts.push({ x: rad * Math.cos(ang), y: rad * Math.sin(ang) });
      }
      return pts;
    }

    const SHALLOW_RIDGE_ANG = ELBOW_ANG + (2.0 * Math.PI) / 3.0;
    const CONTOUR_BANK = new Map();
    for (let k = -160; k <= 54; k += 2) {
      const targetM = k >= 0 ? -Math.log(Math.expm1(Math.pow(2.0, -k))) : k * Math.LN2;
      CONTOUR_BANK.set(k, contourForMargin(targetM));
    }

    const DTYPE_CONTOUR_LABELS = [
      { k: 8,  text: 'bf16', sideOffsetPx: 0 },
      { k: 24, text: 'fp32', sideOffsetPx: 0 },
      { k: 52, text: 'fp64', sideOffsetPx: 22 }
    ].map(item => {
      const targetM = -Math.log(Math.expm1(Math.pow(2.0, -item.k)));
      const rLbl = radiusForMargin(SHALLOW_RIDGE_ANG, targetM, 1.0);
      return {
        ...item,
        labelX: rLbl * Math.cos(SHALLOW_RIDGE_ANG),
        labelY: rLbl * Math.sin(SHALLOW_RIDGE_ANG)
      };
    });

    const DEAD_ZONE_POLYS = {};
    function currentDeadZone(p) {
      if (!DEAD_ZONE_POLYS[p]) {
        const targetM = p * Math.LN2;
        const rLbl = radiusForMargin(SHALLOW_RIDGE_ANG, targetM, 1.0);
        DEAD_ZONE_POLYS[p] = {
          pts: CONTOUR_BANK.get(p) || contourForMargin(targetM),
          labelX: rLbl * Math.cos(SHALLOW_RIDGE_ANG),
          labelY: rLbl * Math.sin(SHALLOW_RIDGE_ANG)
        };
      }
      return DEAD_ZONE_POLYS[p];
    }

    // Square viewport.
    function mapTransform(W, H) {
      const scale = Math.min(W / 1.15, H / 1.15);
      return {
        scale,
        ox: 0.56 * W,
        oy: 0.54 * H
      };
    }

    // Offscreen canvas cache for the static background heatmap.
    let bgCacheCanvas = null;
    let bgCacheKey = '';
    function getStaticBackground(W, H, dpr, dark) {
      const key = `${Math.round(W * dpr)}x${Math.round(H * dpr)}_${dark ? 'd' : 'l'}`;
      if (bgCacheCanvas && bgCacheKey === key) return bgCacheCanvas;
      bgCacheCanvas = document.createElement('canvas');
      bgCacheCanvas.width = Math.round(W * dpr);
      bgCacheCanvas.height = Math.round(H * dpr);
      bgCacheKey = key;
      const bctx = bgCacheCanvas.getContext('2d');
      const { scale, ox, oy } = mapTransform(W, H);
      // Evaluate the loss on a coarse grid (one sample at the center of each
      // stepPx-by-stepPx cell) into a small image, then upsample it with a
      // single drawImage. Painting each cell with its own fillRect leaves faint
      // seams at fractional zoom levels, where cell edges straddle device
      // pixels and adjacent antialiased edges don't sum to fully opaque.
      const stepPx = 2;
      const cols = Math.ceil(W / stepPx);
      const rows = Math.ceil(H / stepPx);
      const grid = document.createElement('canvas');
      grid.width = cols;
      grid.height = rows;
      const gctx = grid.getContext('2d');
      const img = gctx.createImageData(cols, rows);
      for (let r = 0; r < rows; r++) {
        const y = ((r + 0.5) * stepPx - oy) / scale;
        for (let c = 0; c < cols; c++) {
          const x = ((c + 0.5) * stepPx - ox) / scale;
          const loss = lossFromMargin(evalMargin(x, y, 1.0).m);
          const log2L = Math.log2(Math.max(Math.pow(2.0, -33), loss));
          const norm = Math.max(0.0, Math.min(1.0, (log2L + 26.0) / 30.0));
          const i = 4 * (r * cols + c);
          if (dark) {
            const v = Math.round(12 + 22 * norm);
            img.data[i] = v;
            img.data[i + 1] = v + 5;
            img.data[i + 2] = v + 14;
          } else {
            const v = Math.round(252 - 22 * norm);
            img.data[i] = v - 4;
            img.data[i + 1] = v;
            img.data[i + 2] = v + 4;
          }
          img.data[i + 3] = 255;
        }
      }
      gctx.putImageData(img, 0, 0);
      bctx.imageSmoothingEnabled = true;
      bctx.imageSmoothingQuality = 'high';
      bctx.drawImage(grid, 0, 0, cols * stepPx * dpr, rows * stepPx * dpr);
      return bgCacheCanvas;
    }

    // =====================================================================
    // Simulation state
    // =====================================================================
    let fix, std, hist, det;
    let explosions = [];
    let outlierVisTimer = 0;
    let noiseCooldown = 0;

    function newHistory() {
      return {
        lossFix: [], lossStd: [],
        gFix: [], gStd: [],
        m1Fix: [], m1Std: [],
        denomFix: [], denomStd: [],
        stepFix: [], stepStd: []
      };
    }

    function placeBoth(cx, cy, resetHist = false) {
      fix = makeOptState(cx, cy);
      std = makeOptState(cx, cy);
      det = { active: false, arrow: null };
      outlierVisTimer = 0;
      noiseCooldown = 0;
      explosions.forEach(ex => { ex.active = false; });
      if (resetHist || !hist) {
        hist = newHistory();
        explosions = [];
      }
    }

    // Continuous slingshot intensity s in [0, 1] (display-only; never feeds
    // back into the optimizer dynamics): maps the excess log2 step size
    // log2(||u_t||) above slingOnset over span slingSpan with exponent
    // slingGamma:
    //   s(log2Step) = clamp((log2Step - slingOnset) / slingSpan, 0, 1)^slingGamma
    function slingshotIntensity(log2Step) {
      if (!Number.isFinite(log2Step)) return 0.0;
      const raw = (log2Step - slingOnset) / Math.max(0.05, slingSpan);
      if (raw <= 0.0) return 0.0;
      return Math.pow(Math.min(1.0, raw), slingGamma);
    }

    function updateContinuousArrow(updMag, x0, y0) {
      const log2U = (updMag > 0.0 && Number.isFinite(updMag)) ? Math.log2(updMag) : -Infinity;
      const s = slingshotIntensity(log2U);
      if (s > 0.02) {
        if (!det.active || !det.arrow) {
          det.active = true;
          det.arrow = {
            x0, y0, x1: std.x, y1: std.y,
            peakLog2U: log2U, age: 0, maxAge: 30, active: true
          };
          explosions.push(det.arrow);
        } else {
          det.arrow.x1 = std.x;
          det.arrow.y1 = std.y;
          det.arrow.peakLog2U = Math.max(det.arrow.peakLog2U, log2U);
        }
      } else if (det.active) {
        det.active = false;
        if (det.arrow) det.arrow.active = false;
        det.arrow = null;
      }
    }

    const log2OrNegInf = v => (v > 0.0 && Number.isFinite(v)) ? Math.log2(v) : -Infinity;
    const dispLog2 = v => (v > 0.0 && Number.isFinite(v)) ? BIT_SCALE * Math.log2(v) : -Infinity;

    // Each animation frame advances STEPS_PER_FRAME optimizer steps (default 1,
    // so 1 frame = 1 smooth optimizer step).
    const STEPS_PER_FRAME = Math.max(1, Math.round(numParam('spf', 1)));

    function markerRecord(ev, res, o) {
      return {
        loss: ceWeight * lossFromMargin(ev.m),
        g: ceWeight * Math.hypot(o.gx, o.gy),
        m1: res.m1Mag,
        denom: res.denomMag,
        upd: res.updMag
      };
    }

    function optimizerStep() {
      const hp = hyperparams();
      if (noiseCooldown > 0) noiseCooldown -= 1;
      const effNoiseProb = outlierProb <= 0.0 ? 0.0 : Math.min(0.5, 0.25 * Math.pow(outlierProb / 0.1, 0.55));
      const isNoisy = effNoiseProb > 0.0 && noiseCooldown === 0 && Math.random() < effNoiseProb;
      if (isNoisy) {
        outlierVisTimer = targetFps >= 30 ? 4 : 1;
        if (outlierProb <= 0.01) noiseCooldown = 25;
      }
      const stepK = Math.max(4, Math.round((16.0 / Math.sqrt(Math.max(0.1, ceWeight))) / 2) * 2);
      const nextP = Math.min(54, pBits + stepK);
      const contract = isNoisy ? Math.max(0.15, (44.8 - nextP) / (44.8 - pBits)) : 1.0;

      const evFix = evalMargin(fix.x, fix.y, contract);
      const gsFix = gradScaleFixed(evFix.m, pBits);
      const zgFix = zoomGrad(gsFix * evFix.dmx, gsFix * evFix.dmy);
      const resFix = adamwStep(fix, zgFix.gx, zgFix.gy, hp);

      const evStd = evalMargin(std.x, std.y, contract);
      const gsStd = gradScaleStandard(evStd.m, pBits);
      const x0 = std.x, y0 = std.y;
      const zgStd = zoomGrad(gsStd * evStd.dmx, gsStd * evStd.dmy);
      const resStd = adamwStep(std, zgStd.gx, zgStd.gy, hp);
      updateContinuousArrow(resStd.updMag, x0, y0);

      return { f: markerRecord(evFix, resFix, fix), s: markerRecord(evStd, resStd, std) };
    }

    function stepSimulation() {
      if (outlierVisTimer > 0) outlierVisTimer -= 1;
      let bestF = null, bestS = null;
      for (let i = 0; i < STEPS_PER_FRAME; i++) {
        const rec = optimizerStep();
        if (!bestF || rec.f.upd > bestF.upd) bestF = rec.f;
        if (!bestS || rec.s.upd > bestS.upd) bestS = rec.s;
      }
      hist.lossFix.push(log2OrNegInf(bestF.loss));
      hist.lossStd.push(log2OrNegInf(bestS.loss));
      hist.gFix.push(dispLog2(bestF.g));
      hist.gStd.push(dispLog2(bestS.g));
      hist.m1Fix.push(dispLog2(bestF.m1));
      hist.m1Std.push(dispLog2(bestS.m1));
      hist.denomFix.push(dispLog2(bestF.denom));
      hist.denomStd.push(dispLog2(bestS.denom));
      hist.stepFix.push(log2OrNegInf(bestF.upd));
      hist.stepStd.push(log2OrNegInf(bestS.upd));
      if (hist.stepStd.length > MAX_H) {
        Object.keys(hist).forEach(k => hist[k].shift());
      }
    }

    // =====================================================================
    // Controls & Presets (orthogonal to Precision dtype)
    // =====================================================================
    const PRESETS = {
      wd:    { eps: 16, ce: 1.0, outlier: 0.0,   wd: 1.0 },
      noisy: { eps: 7,  ce: 1.0, outlier: 0.003, wd: 0.0 }
    };

    function applyPreset(name, resetSim = true) {
      const cfg = PRESETS[name];
      if (!cfg) return;
      epsExp = cfg.eps;
      ceWeight = cfg.ce;
      ceSliderVal = ceWeight < 0.099 ? -1.1 : clamp(Math.log10(ceWeight), -1.0, 1.0);
      outlierProb = cfg.outlier;
      outlierSliderVal = outlierProb < 0.000095 ? -4.1 : clamp(Math.log10(outlierProb), -4.0, -1.0);
      weightDecay = cfg.wd;
      wdSliderVal = weightDecay < 0.099 ? -1.1 : clamp(Math.log10(weightDecay), -1.0, 1.0);
      updateControlsUI();
      if (resetSim) {
        placeBoth(numParam('x', 0.2), numParam('y', -0.38), true);
      }
    }

    function setPrecision(newP) {
      pBits = Math.round(clamp(newP, 4, 52) / 4) * 4;
      updateControlsUI();
    }

    function updateControlsUI() {
      document.getElementById('epsLabel').textContent = `1e-${epsExp}`;
      document.getElementById('epsSlider').value = String(-epsExp);
      document.getElementById('ceLabel').textContent = fmtWd(ceWeight);
      document.getElementById('ceSlider').value = String(ceSliderVal);
      document.getElementById('outlierLabel').textContent = fmtOutlierProb(outlierProb);
      document.getElementById('outlierSlider').value = String(outlierSliderVal);
      document.getElementById('wdLabel').textContent = fmtWd(weightDecay);
      document.getElementById('wdSlider').value = String(wdSliderVal);

      const activeYellowClasses = isDark()
        ? 'bg-yellow-500/20 border border-yellow-400 text-[var(--foreground)] font-semibold'
        : 'bg-amber-500/20 border-2 border-amber-600 text-amber-950 font-semibold shadow-xs';
      const inactiveBtnClasses = 'text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-transparent';

      document.querySelectorAll('.preset-btn').forEach(btn => {
        const key = btn.dataset.preset;
        const cfg = PRESETS[key];
        const active = cfg &&
          epsExp === cfg.eps &&
          Math.abs(weightDecay - cfg.wd) < 1e-4 &&
          Math.abs(outlierProb - cfg.outlier) < 1e-5 &&
          Math.abs(ceWeight - cfg.ce) < 1e-4;
        btn.className = 'preset-btn px-2.5 py-0.5 rounded text-xs transition-colors ' +
          (active ? activeYellowClasses : inactiveBtnClasses);
      });

      document.querySelectorAll('.dtype-btn').forEach(btn => {
        const active = Number(btn.dataset.p) === pBits;
        btn.className = 'dtype-btn px-2.5 py-0.5 rounded font-mono text-xs transition-colors ' +
          (active ? activeYellowClasses : inactiveBtnClasses);
      });

      const activeBlueClasses = isDark()
        ? 'bg-blue-500/20 border border-blue-500 text-[var(--foreground)] font-semibold'
        : 'bg-blue-500/15 border-2 border-blue-600 text-blue-950 font-semibold shadow-xs';
      document.querySelectorAll('.fps-btn').forEach(btn => {
        const active = Number(btn.dataset.fps) === targetFps;
        btn.className = 'fps-btn px-1.5 py-0.5 rounded font-mono text-xs transition-colors ' +
          (active ? activeBlueClasses : inactiveBtnClasses);
      });

      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.textContent = isDark() ? 'Night Mode: On' : 'Night Mode: Off';
      }
    }

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => applyPreset(btn.dataset.preset, true));
    });
    document.querySelectorAll('.dtype-btn').forEach(btn => {
      btn.addEventListener('click', () => setPrecision(Number(btn.dataset.p)));
    });
    document.getElementById('epsSlider').addEventListener('input', (e) => {
      epsExp = Math.round(clamp(-Number(e.target.value), 1, 30));
      updateControlsUI();
    });
    document.getElementById('ceSlider').addEventListener('input', (e) => {
      ceSliderVal = Number(e.target.value);
      ceWeight = wdFromSlider(ceSliderVal);
      updateControlsUI();
    });
    document.getElementById('outlierSlider').addEventListener('input', (e) => {
      outlierSliderVal = Number(e.target.value);
      outlierProb = outlierFromSlider(outlierSliderVal);
      if (outlierProb === 0.0) outlierVisTimer = 0;
      updateControlsUI();
    });
    document.getElementById('wdSlider').addEventListener('input', (e) => {
      wdSliderVal = Number(e.target.value);
      weightDecay = wdFromSlider(wdSliderVal);
      updateControlsUI();
    });
    document.querySelectorAll('.fps-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        targetFps = Number(btn.dataset.fps);
        updateControlsUI();
      });
    });
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      userTheme = isDark() ? 'light' : 'dark';
      ensureStandaloneTheme();
      updateControlsUI();
      drawMap();
      drawStrip();
    });

    const INIT_PRESET = URL_PARAMS.get('preset');
    if (INIT_PRESET && PRESETS[INIT_PRESET]) {
      applyPreset(INIT_PRESET, false);
    } else {
      updateControlsUI();
    }
    placeBoth(numParam('x', 0.2), numParam('y', -0.38), true);

    mapCanvas.addEventListener('pointerdown', (e) => {
      const rect = mapWrap.getBoundingClientRect();
      const { scale, ox, oy } = mapTransform(rect.width, rect.height);
      const cx = (e.clientX - rect.left - ox) / scale;
      const cy = (e.clientY - rect.top - oy) / scale;
      placeBoth(cx, cy, false);
    });

    // =====================================================================
    // Drawing: 2D loss surface
    // =====================================================================
    function slingBarFill(intensity, dark) {
      const s = clamp(intensity, 0.0, 1.0);
      if (dark) {
        const g = Math.round(165 + 55 * s);
        const b = Math.round(8 + 28 * s);
        const a = (0.14 + 0.84 * s).toFixed(3);
        return `rgba(250, ${g}, ${b}, ${a})`;
      }
      const r = Math.round(217 + 33 * s);
      const g = Math.round(135 + 69 * s);
      const b = Math.round(6 + 15 * s);
      const a = (0.16 + 0.80 * s).toFixed(3);
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function drawArrowWithImpactRing(ctx, x0, y0, x1, y1, color, prog, alpha, intensity = 1.0) {
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.hypot(dx, dy);
      if (len < 3.5 || alpha <= 0.01) return;
      const s = clamp(intensity, 0.1, 1.0);
      const ang = Math.atan2(dy, dx);
      const headLen = (8.5 + 5.0 * s) * Math.min(1.0, len / 12.0);
      const shaftEndX = x1 - headLen * 0.65 * Math.cos(ang);
      const shaftEndY = y1 - headLen * 0.65 * Math.sin(ang);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;

      const rRing = (4.0 + 2.0 * s) + (5.0 + 6.0 * s) * prog;
      ctx.lineWidth = 1.4 + 1.0 * s;
      ctx.beginPath();
      ctx.arc(x0, y0, rRing, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 2.2 + 2.4 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(shaftEndX, shaftEndY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - headLen * Math.cos(ang - 0.42), y1 - headLen * Math.sin(ang - 0.42));
      ctx.lineTo(x1 - headLen * 0.72 * Math.cos(ang), y1 - headLen * 0.72 * Math.sin(ang));
      ctx.lineTo(x1 - headLen * Math.cos(ang + 0.42), y1 - headLen * Math.sin(ang + 0.42));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawContourPill(ctx, text, x, y, isHighlight, dark) {
      ctx.save();
      ctx.font = (isHighlight ? '700 ' : '600 ') + '10px ui-monospace, SFMono-Regular, monospace';
      const tw = ctx.measureText(text).width;
      const pw = tw + 8;
      const ph = 14;
      ctx.fillStyle = isHighlight ? (dark ? '#1e1b08' : '#fef3c7') : (dark ? '#0b0f19' : '#ffffff');
      ctx.strokeStyle = isHighlight ? (dark ? COL_DEAD : '#d97706') : (dark ? '#475569' : '#94a3b8');
      ctx.lineWidth = isHighlight ? (dark ? 1.6 : 2.0) : 1.0;
      ctx.beginPath();
      ctx.roundRect(x - pw / 2, y - ph / 2, pw, ph, 3.5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = isHighlight ? (dark ? '#fde047' : '#92400e') : (dark ? '#94a3b8' : '#475569');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y + 0.5);
      ctx.restore();
    }

    function tracePoly(ctx, pts, ox, oy, scale) {
      ctx.beginPath();
      pts.forEach((pt, idx) => {
        const px = ox + pt.x * scale;
        const py = oy + pt.y * scale;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
    }

    function getActiveCeContourKs() {
      if (ceWeight <= 0.0) return [];
      const stepK = Math.max(4, Math.round((16.0 / Math.sqrt(ceWeight)) / 2) * 2);
      const ks = new Set([8, 24, 52]);
      for (let k = 8; k <= 52; k += stepK) ks.add(k);
      for (let k = 8 - stepK; k >= -160; k -= stepK) ks.add(k);
      return Array.from(ks).sort((a, b) => a - b);
    }

    function nextInnerDeadZonePoly(p) {
      const ks = getActiveCeContourKs();
      const idx = ks.indexOf(p);
      const nextK = (idx >= 0 && idx + 1 < ks.length) ? ks[idx + 1] : Math.min(54, p + 16);
      return currentDeadZone(nextK).pts;
    }

    function drawInPlotLegend(ctx, W, H, dark) {
      const items = [
        { label: 'Standard CE', kind: 'std' },
        { label: 'Our Fixed CE', kind: 'fix' },
        { label: 'Float Cutoff', kind: 'dead' }
      ];
      ctx.save();
      ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
      const rowH = 17;
      const boxW = 35 + Math.max(...items.map(it => ctx.measureText(it.label).width));
      const boxH = items.length * rowH + 10;
      const x0 = 10;
      const y0 = H - boxH - 10;

      ctx.fillStyle = dark ? 'rgba(15, 23, 42, 0.82)' : 'rgba(248, 250, 252, 0.88)';
      ctx.strokeStyle = dark ? 'rgba(51, 65, 85, 0.65)' : 'rgba(203, 213, 225, 0.85)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x0, y0, boxW, boxH, 6);
      ctx.fill();
      ctx.stroke();

      items.forEach((it, idx) => {
        const cy = y0 + 13.5 + idx * rowH;
        const cx = x0 + 13;
        if (it.kind === 'fix') {
          ctx.strokeStyle = COL_FIX;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(cx, cy, 4.8, 0, Math.PI * 2);
          ctx.stroke();
        } else if (it.kind === 'std') {
          ctx.fillStyle = COL_STD;
          ctx.beginPath();
          ctx.arc(cx, cy, 4.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = dark ? 'rgba(250, 204, 21, 0.30)' : 'rgba(250, 204, 21, 0.38)';
          ctx.strokeStyle = dark ? 'rgba(250, 204, 21, 0.75)' : 'rgba(202, 138, 4, 0.75)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(cx - 4.5, cy - 4.5, 9, 9, 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.label, x0 + 25, cy + 0.5);
      });
      ctx.restore();
    }

    function drawMap() {
      const dpr = window.devicePixelRatio || 1;
      const rect = mapWrap.getBoundingClientRect();
      const targetW = Math.max(1, Math.round(rect.width * dpr));
      const targetH = Math.max(1, Math.round(rect.height * dpr));
      if (mapCanvas.width !== targetW || mapCanvas.height !== targetH) {
        mapCanvas.width = targetW;
        mapCanvas.height = targetH;
      }
      const ctx = mapCanvas.getContext('2d');
      ctx.save();
      // ?mapref=N lays the map out as if it were N px wide and scales it up
      // (text, markers, and legend grow with the map; used for recordings).
      const ui = MAP_REF_PX > 0 ? Math.max(1.0, rect.width / MAP_REF_PX) : 1.0;
      ctx.scale(dpr * ui, dpr * ui);

      const W = rect.width / ui, H = rect.height / ui;
      const dark = isDark();
      const { scale, ox, oy } = mapTransform(W, H);
      const showNoisy = outlierVisTimer > 0;
      const dz = currentDeadZone(pBits);

      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(getStaticBackground(W, H, dpr * ui, dark), 0, 0, W, H);

      const CONTOUR_STROKE = dark ? 'rgba(148, 163, 184, 0.16)' : 'rgba(71, 85, 105, 0.14)';
      const LABEL_TEXT_COLOR = dark ? '#94a3b8' : '#475569';
      if (ceWeight > 0.0) {
        getActiveCeContourKs().forEach(k => {
          const pts = CONTOUR_BANK.get(k);
          if (!pts) return;
          tracePoly(ctx, pts, ox, oy, scale);
          ctx.strokeStyle = CONTOUR_STROKE;
          ctx.lineWidth = 1.0;
          ctx.stroke();
        });
      }

      // Weight decay penalty contours, with "Weight\nDecay" centered in the
      // concentric rings.
      const wx = ox + WD_X * scale, wy = oy + WD_Y * scale;
      if (weightDecay > 0.0) {
        const spacingPx = 2.0 * Math.sqrt(2.0 * WD_LEVEL / weightDecay) * scale;
        ctx.save();
        ctx.strokeStyle = CONTOUR_STROKE;
        ctx.lineWidth = 1.0;
        const maxR = Math.hypot(Math.max(wx, W - wx), Math.max(wy, H - wy));
        for (let r = spacingPx; r < maxR; r += spacingPx) {
          if (r < 28.0) continue;
          ctx.beginPath();
          ctx.arc(wx, wy, r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = LABEL_TEXT_COLOR;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '700 12px ui-monospace, SFMono-Regular, monospace';
        ctx.fillText('Weight', wx, wy - 6.5);
        ctx.fillText('Decay', wx, wy + 7.5);
        ctx.restore();
      }

      // Soft yellow Float Cutoff polygon (snaps exactly to the next inner contour
      // level on noisy-label events while all contour lines and dtype pills stay fixed).
      if (ceWeight > 0.0) {
        const dzPts = showNoisy ? nextInnerDeadZonePoly(pBits) : dz.pts;
        tracePoly(ctx, dzPts, ox, oy, scale);
        ctx.fillStyle = dark ? 'rgba(250, 204, 21, 0.11)' : 'rgba(250, 204, 21, 0.15)';
        ctx.fill();
        ctx.strokeStyle = dark ? 'rgba(250, 204, 21, 0.36)' : 'rgba(202, 138, 4, 0.36)';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        const ca = Math.cos(SHALLOW_RIDGE_ANG), sa = Math.sin(SHALLOW_RIDGE_ANG);
        if (SHOW_DTYPE_PILLS) DTYPE_CONTOUR_LABELS
          .slice()
          .sort((a, b) => ((a.k === pBits) ? 1 : 0) - ((b.k === pBits) ? 1 : 0))
          .forEach(c => {
            const isDead = c.k === pBits;
            const px = ox + c.labelX * scale + c.sideOffsetPx * ca;
            const py = oy + c.labelY * scale + c.sideOffsetPx * sa;
            drawContourPill(ctx, c.text, px, py, isDead, dark);
          });
      }

      // Center '×' mark at the CE minimum (0, 0) and "Cross\nEntropy" label
      // positioned slightly below so when Blue settles at the center it sits
      // on the '×' with the label cleanly underneath it.
      ctx.save();
      ctx.strokeStyle = LABEL_TEXT_COLOR;
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      const xm = 4.2;
      ctx.beginPath();
      ctx.moveTo(ox - xm, oy - xm);
      ctx.lineTo(ox + xm, oy + xm);
      ctx.moveTo(ox - xm, oy + xm);
      ctx.lineTo(ox + xm, oy - xm);
      ctx.stroke();

      ctx.fillStyle = LABEL_TEXT_COLOR;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 12px ui-monospace, SFMono-Regular, monospace';
      ctx.fillText('Cross', ox, oy + 16.0);
      ctx.fillText('Entropy', ox, oy + 29.0);
      ctx.restore();

      const arrowColor = dark ? '#FACC15' : '#EAB308';
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        const s = slingshotIntensity(ex.peakLog2U);
        if (s <= 0.01) continue;
        const prog = ex.age / ex.maxAge;
        const alpha = Math.max(0, (1.0 - prog * 0.85) * (0.18 + 0.82 * s));
        drawArrowWithImpactRing(ctx, ox + ex.x0 * scale, oy + ex.y0 * scale,
          ox + ex.x1 * scale, oy + ex.y1 * scale, arrowColor, prog, alpha, s);
      }

      ctx.fillStyle = COL_STD;
      ctx.beginPath();
      ctx.arc(ox + std.x * scale, oy + std.y * scale, 4.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = COL_FIX;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(ox + fix.x * scale, oy + fix.y * scale, 6.2, 0, Math.PI * 2);
      ctx.stroke();

      if (SHOW_MAP_TITLE) {
        const mapTitle = 'Loss Landscape';
        ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
        const titleW = ctx.measureText(mapTitle).width + 12;
        ctx.fillStyle = dark ? 'rgba(15, 23, 42, 0.78)' : 'rgba(248, 250, 252, 0.85)';
        ctx.fillRect(8, 8, titleW, 18);
        ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(mapTitle, 14, 17);
      }

      if (SHOW_LEGEND) drawInPlotLegend(ctx, W, H, dark);

      ctx.restore();
    }

    // =====================================================================
    // Drawing: 4 synchronized step-bar tracks
    // =====================================================================
    function drawDashTopper(ctx, xL, colW, y, color, isDashed, thickness = 2.4, phase = 0.0) {
      ctx.fillStyle = color;
      if (isDashed) {
        const nDots = 2;
        const step = colW / nDots;
        const dotW = Math.max(2.4, step * 0.56);
        for (let k = 0; k < nDots; k++) {
          const dx = (k * step + phase * colW) % colW;
          const w = Math.min(dotW, colW - dx);
          if (w > 0.4) {
            ctx.fillRect(xL + dx, y - thickness / 2, w, thickness);
          }
        }
      } else {
        ctx.fillRect(xL, y - thickness / 2, Math.max(1.5, colW - 0.2), thickness);
      }
    }

    function drawStrip() {
      if (MAP_ONLY) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = stripWrap.getBoundingClientRect();
      const targetW = Math.max(1, Math.round(rect.width * dpr));
      const targetH = Math.max(1, Math.round(rect.height * dpr));
      if (stripCanvas.width !== targetW || stripCanvas.height !== targetH) {
        stripCanvas.width = targetW;
        stripCanvas.height = targetH;
      }
      const ctx = stripCanvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);

      const W = rect.width, H = rect.height;
      const dark = isDark();
      ctx.clearRect(0, 0, W, H);

      const padL = 52, padR = 10, padT = 4, padB = 4;
      const gap = 10;
      const nTracks = 4;
      const trackH = (H - padT - padB - gap * (nTracks - 1)) / nTracks;
      const plotW = W - padL - padR;
      const colW = plotW / MAX_H;
      const solidYellow = dark ? '#FACC15' : '#EAB308';
      const firstMomentColor = dark ? '#FFFFFF' : '#0F172A';

      const tracks = [
        {
          title: 'Loss',
          yMin: -56, yMax: 6, ticks: [0, -16, -32, -48],
          kind: 'bars', fixArr: hist.lossFix, stdArr: hist.lossStd,
          refExp: -pBits, refColor: solidYellow, refSolid: true
        },
        {
          title: 'Gradient Norm',
          yMin: -56, yMax: 8, ticks: [0, -16, -32, -48],
          kind: 'bars', fixArr: hist.gFix, stdArr: hist.gStd
        },
        {
          title: `Adam Moments: ${dark ? 'white' : 'black'} = 1st, red = 2nd`,
          yMin: -56, yMax: 8, ticks: [0, -16, -32, -48],
          kind: 'moment_delta',
          refExp: -epsExp * Math.LOG2E * Math.LN10,
          refColor: dark ? 'rgba(148, 163, 184, 0.35)' : 'rgba(100, 116, 139, 0.35)'
        },
        {
          title: 'Adam Update Norm',
          yMin: -12, yMax: 5.2, ticks: [4, 0, -4, -8, -12],
          kind: 'step_bars', fixArr: hist.stepFix, stdArr: hist.stepStd
        }
      ];

      tracks.forEach((tr, idx) => {
        const top = padT + idx * (trackH + gap);
        const bot = top + trackH;
        const floorY = bot - 5;

        ctx.fillStyle = dark ? 'rgba(30, 41, 59, 0.42)' : 'rgba(241, 245, 249, 0.78)';
        ctx.strokeStyle = dark ? '#1f2937' : '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(padL, top, plotW, trackH, 6);
        ctx.fill();
        ctx.stroke();

        const mapY = (v) => {
          const clamped = Math.max(tr.yMin, Math.min(tr.yMax, v));
          const norm = (clamped - tr.yMin) / (tr.yMax - tr.yMin);
          return floorY - norm * (trackH - 22);
        };

        ctx.font = '10px ui-monospace, SFMono-Regular, monospace';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        tr.ticks.forEach(tk => {
          if (tk < tr.yMin || tk > tr.yMax) return;
          const py = mapY(tk);
          ctx.strokeStyle = dark ? 'rgba(148, 163, 184, 0.12)' : 'rgba(100, 116, 139, 0.13)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(padL, py);
          ctx.lineTo(padL + plotW, py);
          ctx.stroke();
          ctx.fillStyle = dark ? '#94a3b8' : '#64748b';
          let lbl = fmtPow2(tk);
          if (tr.kind === 'step_bars' && tk === 0) lbl = '2⁰(1×)';
          ctx.fillText(lbl, padL - 5, py);
        });

        if (tr.refExp !== undefined && tr.refExp >= tr.yMin && tr.refExp <= tr.yMax) {
          const pyRef = mapY(tr.refExp);
          ctx.save();
          ctx.strokeStyle = tr.refColor;
          ctx.lineWidth = tr.refSolid ? 1.6 : 1.2;
          if (!tr.refSolid) ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(padL, pyRef);
          ctx.lineTo(padL + plotW, pyRef);
          ctx.stroke();
          ctx.restore();
        }

        const N = hist.stepStd.length;
        for (let i = 0; i < N; i++) {
          const xL = padL + i * colW;
          const barW = Math.max(1.5, colW - 0.3);
          const sBoom = slingshotIntensity(hist.stepStd[i]);

          if (tr.kind === 'moment_delta') {
            const yNumFix = mapY(hist.m1Fix[i]);
            const yDenFix = mapY(hist.denomFix[i]);
            const yNumStd = mapY(hist.m1Std[i]);
            const yDenStd = mapY(hist.denomStd[i]);
            if (sBoom > 0.01) {
              ctx.fillStyle = slingBarFill(sBoom, dark);
              ctx.fillRect(xL, Math.min(yNumStd, yDenStd), barW,
                Math.max(2.0, Math.abs(yDenStd - yNumStd)));
            }
            drawDashTopper(ctx, xL, colW, yDenStd, COL_STD, false, 2.4);
            drawDashTopper(ctx, xL, colW, yNumStd, firstMomentColor, true, 2.3, 0.25);
            drawDashTopper(ctx, xL, colW, yDenFix,
              dark ? 'rgba(147, 197, 253, 0.75)' : 'rgba(59, 130, 246, 0.55)', true, 1.8, 0.25);
            drawDashTopper(ctx, xL, colW, yNumFix, COL_FIX, true, 2.4, 0.0);
          } else if (tr.kind === 'step_bars') {
            const yFix = mapY(tr.fixArr[i]);
            const yStd = mapY(tr.stdArr[i]);
            if (sBoom > 0.01) {
              ctx.fillStyle = slingBarFill(sBoom, dark);
              ctx.fillRect(xL, yStd, barW, Math.max(2.0, floorY - yStd));
            } else if (tr.stdArr[i] > tr.yMin + 0.5) {
              ctx.fillStyle = dark ? 'rgba(239, 68, 68, 0.14)' : 'rgba(220, 38, 38, 0.11)';
              ctx.fillRect(xL, yStd, barW, Math.max(0, floorY - yStd));
            }
            drawDashTopper(ctx, xL, colW, yStd, COL_STD, false, 2.4);
            drawDashTopper(ctx, xL, colW, yFix, COL_FIX, true, 2.4, 0.0);
          } else {
            const yFix = mapY(tr.fixArr[i]);
            const yStd = mapY(tr.stdArr[i]);
            if (tr.stdArr[i] > tr.yMin + 0.5) {
              ctx.fillStyle = dark ? 'rgba(239, 68, 68, 0.15)' : 'rgba(220, 38, 38, 0.12)';
              ctx.fillRect(xL, yStd, barW, Math.max(0, floorY - yStd));
            }
            drawDashTopper(ctx, xL, colW, yStd, COL_STD, false, 2.4);
            drawDashTopper(ctx, xL, colW, yFix, COL_FIX, true, 2.4, 0.0);
          }
        }

        ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
        const titleW = ctx.measureText(tr.title).width + 10;
        ctx.fillStyle = dark ? 'rgba(15, 23, 42, 0.78)' : 'rgba(248, 250, 252, 0.85)';
        ctx.fillRect(padL + 4, top + 2, titleW, 14);
        ctx.fillStyle = dark ? '#e2e8f0' : '#1e293b';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(tr.title, padL + 7, top + 3.5);
      });

      ctx.restore();
    }

    // =====================================================================
    // Fixed-rate stepping, decoupled from the display refresh rate.
    // =====================================================================
    function ageExplosions() {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        if (ex.active) continue;
        ex.age += 1;
        if (ex.age >= ex.maxAge) explosions.splice(i, 1);
      }
    }

    let lastTime = performance.now();
    let accumMs = 0;

    function tick(now) {
      const dt = Math.min(100, now - lastTime);
      lastTime = now;
      if (targetFps > 0) {
        const stepIntervalMs = 1000.0 / targetFps;
        accumMs += dt;
        while (accumMs >= stepIntervalMs) {
          accumMs -= stepIntervalMs;
          stepSimulation();
          ageExplosions();
        }
      }
      drawMap();
      drawStrip();
      requestAnimationFrame(tick);
    }

    // Parent-page control (works across origins, including file://):
    //   postMessage({slingshot: 'start', preset: 'wd', fps: 60})  reset + run
    //   postMessage({slingshot: 'reset', preset: 'wd'})           reset + pause
    //   postMessage({slingshot: 'legend', on: true})              show/hide legend
    window.addEventListener('message', (e) => {
      const msg = e.data || {};
      if (msg.slingshot === 'legend') {
        SHOW_LEGEND = !!msg.on;
        return;
      }
      if (msg.slingshot !== 'start' && msg.slingshot !== 'reset') return;
      const preset = PRESETS[msg.preset] ? msg.preset : (INIT_PRESET || 'wd');
      applyPreset(preset, true);
      targetFps = msg.slingshot === 'start' ? (Number(msg.fps) || 60) : 0;
      lastTime = performance.now();
      accumMs = 0;
      updateControlsUI();
    });

    // Optional ?warmup=N runs N frames before the first draw (for screenshots).
    const WARMUP_STEPS = Math.round(clamp(numParam('warmup', 0), 0, 20000));
    for (let i = 0; i < WARMUP_STEPS; i++) {
      stepSimulation();
      ageExplosions();
    }
    drawMap();
    drawStrip();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
